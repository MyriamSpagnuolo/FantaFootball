spring.application.name=fantafootball
# Spring
spring.main.banner-mode=off

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fantafootball}
spring.datasource.username=${DB_USER:postgresMaster}
spring.datasource.password=${DB_PASS:goPostgresGo}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=trace

# Springdoc / Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# App - CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# App - JWT
app.jwt.issuer=${JWT_ISSUER:fantafootball}
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=${JWT_TTL:PT1H}
